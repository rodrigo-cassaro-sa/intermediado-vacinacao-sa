<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 56 400 400" width="512" height="512" role="img" aria-label="S&amp;A Imunizações">
  <defs>
    <linearGradient id="saBlueOut" gradientUnits="userSpaceOnUse" x1="170" y1="400" x2="250" y2="70">
      <stop offset="0" stop-color="#45c2ef"/>
      <stop offset="0.45" stop-color="#2b74b4"/>
      <stop offset="0.8" stop-color="#0f4275"/>
