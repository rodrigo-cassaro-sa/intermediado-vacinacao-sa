    <linearGradient id="saBlueIn" gradientUnits="userSpaceOnUse" x1="285" y1="115" x2="300" y2="330">
      <stop offset="0" stop-color="#0f4275"/>
      <stop offset="0.45" stop-color="#3aabde"/>
